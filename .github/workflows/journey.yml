name: Journey

# The buyer journey against the REAL seller portal (brief M8): the portal backend (Yanky1/Yanky1-test-login-backend, built and run, never changed), this API on PostgreSQL,
# the web server and a mail sandbox, all started by tools/journey/stack.sh (the same script runs locally: tools/journey/run.sh).
# There is no mock portal anywhere in this job. If the portal cannot be checked out, built or started, the job FAILS with a message saying so: it is never skipped and never green without it.

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      web_ref:
        description: "Ref of Yanky1/solvelt-marketplace-web to run against"
        default: main
      portal_ref:
        description: "Ref of Yanky1/Yanky1-test-login-backend to run against"
        default: main

permissions:
  contents: read

concurrency:
  group: journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    name: Buyer journey (real portal, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Where the checkouts and the logs go
        run: |
          echo "PORTAL_DIR=$RUNNER_TEMP/portal" >> "$GITHUB_ENV"
          echo "WEB_DIR=$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          echo "JOURNEY_RUN_DIR=$RUNNER_TEMP/journey-run" >> "$GITHUB_ENV"

      # The portal repo is public (2026-11-04). BACKEND_REPO_TOKEN (read-only, only the owner can add it) is used when present, in case it becomes private again.
      - name: Check out the seller-portal backend (read-only)
        id: portal
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Yanky1/Yanky1-test-login-backend
          ref: ${{ inputs.portal_ref || 'main' }}
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: _portal
      - name: Fail clearly when the portal is missing
        if: steps.portal.outcome != 'success'
        run: |
          echo "::error title=Seller portal not available::The journey runs against the REAL seller portal (Yanky1/Yanky1-test-login-backend) and it could not be checked out. It is public; if it is private again, the owner must add a read-only token as the repository secret BACKEND_REPO_TOKEN (ask the orchestrator). There is no mock-portal fallback: this job fails instead of going green without the portal."
          exit 1
      - name: Check out the web app
        id: web
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Yanky1/solvelt-marketplace-web
          ref: ${{ inputs.web_ref || 'main' }}
          path: _web
      - name: Fail clearly when the web app is missing
        if: steps.web.outcome != 'success'
        run: |
          echo "::error title=Web app not available::Yanky1/solvelt-marketplace-web could not be checked out, so the buyer journey cannot run."
          exit 1
      # outside the workspace: this repo's Directory.Build.props (warnings as errors) must not apply to the portal's projects
      - name: Move the checkouts out of the workspace
        run: |
          mv _portal "$PORTAL_DIR"
          mv _web "$WEB_DIR"
          git -C "$PORTAL_DIR" log --oneline -1
          git -C "$WEB_DIR" log --oneline -1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the web app and a browser
        working-directory: ${{ runner.temp }}/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the journeys
        run: tools/journey/run.sh
        env:
          CI: "true"

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-logs
          path: |
            ${{ runner.temp }}/journey-run/*.log
            ${{ runner.temp }}/journey-run/*.png
            ${{ runner.temp }}/journey-run/env.json
          retention-days: 7

  # Opt-in: a REAL Stripe test-mode key from the repository secret STRIPE_TEST_SECRET_KEY (a sk_test_ key; the API refuses live keys at start-up). Without the secret this job is
  # SKIPPED and says so in its summary: it never fails for a missing key (brief M8). The fake-provider job above always runs.
  journey-real-stripe:
    name: Buyer journey with real Stripe test keys (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - name: Is a Stripe test key configured?
        id: key
        run: |
          if [ -n "$STRIPE_TEST_SECRET_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real-Stripe journey skipped::The repository secret STRIPE_TEST_SECRET_KEY is not set, so the opt-in real-Stripe journey did not run (the fake-provider journeys did). Add a Stripe TEST secret key to enable it."
            echo "### Real-Stripe journey: SKIPPED (secret STRIPE_TEST_SECRET_KEY not set)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - name: Check out the seller-portal backend (read-only)
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yanky1/Yanky1-test-login-backend
          ref: main
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: _portal
      - name: Check out the web app
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yanky1/solvelt-marketplace-web
          ref: main
          path: _web
      - name: Move the checkouts out of the workspace
        if: steps.key.outputs.present == 'true'
        run: |
          mv _portal "$RUNNER_TEMP/portal"
          mv _web "$RUNNER_TEMP/web"
          echo "PORTAL_DIR=$RUNNER_TEMP/portal" >> "$GITHUB_ENV"
          echo "WEB_DIR=$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          echo "JOURNEY_RUN_DIR=$RUNNER_TEMP/journey-run" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        if: steps.key.outputs.present == 'true'
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install the web app
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ runner.temp }}/web
        run: npm ci
      - name: Run the real-Stripe journey
        if: steps.key.outputs.present == 'true'
        run: JOURNEY_REAL_STRIPE=1 tools/journey/run.sh stripe
        env:
          CI: "true"
      - name: Keep the logs of a failed run
        if: failure() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: journey-stripe-logs
          path: |
            ${{ runner.temp }}/journey-run/*.log
          retention-days: 7
