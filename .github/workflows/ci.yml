name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-sqlite:
    name: Build and test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      # a test that runs longer than 5 minutes is a hang: the run stops there and names it (a PostgreSQL-only deadlock once held a job for 20+ minutes)
      # the tests that need a PostgreSQL server (trait Db=Postgres, decision M8-15) are left out here and run in the PostgreSQL job below: this job reports 0 skipped
      - run: dotnet test --no-build -c Release --filter "Db!=Postgres" --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=results.trx"
      # when the tests above failed: name the failed tests and their messages (from the .trx) in this step's log, as annotations of the run and in the job summary, because the log of the job ends with the
      # service container's output (the failing test is otherwise hard to find). It changes no test and no filter, and runs only after a failure.
      - name: Name the failed tests
        if: failure()
        run: python3 tools/ci/print-failed-tests.py

  test-postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_PROVIDER: postgres
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      # same guard as above; the .trx is new here so a failure can be named (see the step after)
      - run: dotnet test --no-build -c Release --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=results.trx"
      # when the tests above failed: name the failed tests and their messages (from the .trx) in this step's log, as annotations of the run and in the job summary, because the log of the job ends with the
      # service container's output (the failing test is otherwise hard to find). It changes no test and no filter, and runs only after a failure.
      - name: Name the failed tests
        if: failure()
        run: python3 tools/ci/print-failed-tests.py
