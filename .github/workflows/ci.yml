name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-sqlite:
    name: Build and test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      # a test that runs longer than 5 minutes is a hang: the run stops there and names it (a PostgreSQL-only deadlock once held a job for 20+ minutes)
      - run: dotnet test --no-build -c Release --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=results.trx"

  test-postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_PROVIDER: postgres
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      # same guard as above
      - run: dotnet test --no-build -c Release --blame-hang --blame-hang-timeout 5m
