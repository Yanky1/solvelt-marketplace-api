name: Real-Stripe journey

# The buyer journey with REAL Stripe test keys (decisions M8-09, W3-05): an order paid through Stripe's API with Stripe's own event replayed, signed; a refund made at Stripe; and the 3DS test
# card through the real Stripe.js in a browser. The fake-provider journeys (journey.yml) run on every push; this one does NOT, by design:
#
#   RUN ONLY BY HAND (workflow_dispatch) AND WEEKLY, NEVER ON PUSH OR PULL REQUEST, until one manual run has passed with the owner's real test keys (orchestrator decision 2026-11-23, W3-05).
#
# Several facts it relies on about Stripe (the Events API listing, the 3DS test card and its test challenge, the field names inside the Payment Element) could not be checked against
# Stripe's documentation when it was written (the network blocked it): they are marked UNVERIFIED in tools/journey/stripe-journey.mjs. A wrong one must not turn every merge red, so the
# job stays out of the push path until a manual run has proven them; then a follow-up may move it next to the journey job.

on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: "Ref of Yanky1/solvelt-marketplace-web to run against"
        default: main
      portal_ref:
        description: "Ref of Yanky1/Yanky1-test-login-backend to run against"
        default: main
  schedule:
    - cron: "23 4 * * 1"   # Mondays 04:23 UTC: a weekly check that Stripe still behaves as the journey expects

permissions:
  contents: read

concurrency:
  group: stripe-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A REAL Stripe test-mode key from the repository secret STRIPE_TEST_SECRET_KEY (the API refuses live keys at start-up). Without the secret this job is SKIPPED and says so in its
  # summary: it never fails for a missing key (brief M8).
  journey-real-stripe:
    name: Buyer journey with real Stripe test keys (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Is a Stripe test key configured?
        id: key
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}   # this step only reads whether it is set; the key is never written out
        run: |
          if [ -n "$STRIPE_TEST_SECRET_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real-Stripe journey skipped::The repository secret STRIPE_TEST_SECRET_KEY is not set, so the opt-in real-Stripe journey did not run (the fake-provider journeys did). Add a Stripe TEST secret key to enable it."
            echo "### Real-Stripe journey: SKIPPED (secret STRIPE_TEST_SECRET_KEY not set)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - name: Check out the seller-portal backend (read-only)
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yanky1/Yanky1-test-login-backend
          ref: ${{ inputs.portal_ref || 'main' }}
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: _portal
          persist-credentials: false
      - name: Check out the web app
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Yanky1/solvelt-marketplace-web
          ref: ${{ inputs.web_ref || 'main' }}
          path: _web
          persist-credentials: false
      - name: Move the checkouts out of the workspace
        if: steps.key.outputs.present == 'true'
        run: |
          mv _portal "$RUNNER_TEMP/portal"
          mv _web "$RUNNER_TEMP/web"
          echo "PORTAL_DIR=$RUNNER_TEMP/portal" >> "$GITHUB_ENV"
          echo "WEB_DIR=$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          echo "JOURNEY_RUN_DIR=$RUNNER_TEMP/journey-run" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        if: steps.key.outputs.present == 'true'
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install the web app and a browser (the 3DS step drives the real Stripe.js)
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ runner.temp }}/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the real-Stripe journey
        if: steps.key.outputs.present == 'true'
        run: JOURNEY_REAL_STRIPE=1 tools/journey/run.sh stripe
        env:
          CI: "true"
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}   # only this step sees the key
          # W3-05: a pk_test_ key turns on the 3DS step (the real Stripe.js on the checkout page). Not a secret by nature (Stripe shows it to every browser), kept with the other one; unset skips the step with a notice
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      - name: Keep the logs of a failed run
        if: failure() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: journey-stripe-logs
          path: |
            ${{ runner.temp }}/journey-run/*.log
          retention-days: 7
